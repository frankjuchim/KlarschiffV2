name: Klarschiff
options:
  deploymentTarget:
    macOS: "26.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  KlarschiffCore:
    path: Packages/KlarschiffCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Klarschiff:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: KlarschiffCore
        product: KlarschiffCore
    settings:
      base:
        PRODUCT_NAME: Klarschiff
        PRODUCT_BUNDLE_IDENTIFIER: de.frankjuchim.klarschiff2
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Klarschiff.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Klarschiff
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  KlarschiffTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
    dependencies:
      - target: Klarschiff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.frankjuchim.klarschiff2.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Klarschiff.app/Contents/MacOS/Klarschiff"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Klarschiff:
    build:
      targets:
        Klarschiff: all
    run:
      config: Debug
      # Jeder Start aus Xcode ist ein Trockenlauf; echter Lauf nur über die gebaute App aus dem Finder.
      commandLineArguments:
        "--dry-run": true
    test:
      config: Debug
      # Eigene (deaktivierte) Argumente, damit der Test-Host das Run-Argument nicht erbt.
      commandLineArguments:
        "--dry-run": false
      targets:
        - KlarschiffTests
