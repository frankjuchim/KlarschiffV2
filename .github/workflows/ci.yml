name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test KlarschiffCore
        run: swift test --package-path Packages/KlarschiffCore
      - name: Generate project
        run: xcodegen generate
      - name: Build and test app
        run: xcodebuild -scheme Klarschiff -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
